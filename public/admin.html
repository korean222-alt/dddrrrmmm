<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>인증 승인 · 오케이스트라</title>
  <style>
    :root { --ink: #2b1d3a; --muted: #7a6d88; --line: #e6e1ee; --bg: #f7f4fb; --ok: #2f8a3c; --bad: #c2410c; --pink: #d6337e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #cfc6db; border-radius: 10px; background: #fff; color: var(--ink); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--ink); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid #cfc6db; }
    button:disabled { opacity: 0.5; }
    .msg { margin-top: 10px; font-size: 14px; min-height: 1.5em; }
    .msg.ok { color: var(--ok); }
    .msg.bad { color: var(--bad); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    .code { font: 600 17px ui-monospace, Menlo, monospace; letter-spacing: 1px; }
    .meta { font-size: 12px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .head b { font-size: 15px; }
    ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>인스타 인증 승인</h1>
    <p>인스타 앱에서 DM 을 보고, 보낸 사람이 팔로우 중이면 여기서 승인하세요.</p>

    <div class="card" id="login">
      <label for="token">관리자 비밀번호</label>
      <input id="token" type="password" autocomplete="current-password" />
      <div style="margin-top:10px"><button id="login-btn">들어가기</button></div>
      <div class="msg" id="login-msg"></div>
    </div>

    <div id="app" hidden>
      <div class="card">
        <ol>
          <li style="display:list-item;border:0;padding:0">DM 으로 온 코드(예: OK-ABC123)와 보낸 사람 아이디 확인</li>
          <li style="display:list-item;border:0;padding:0">그 사람 프로필에서 나를 팔로우 중인지 확인</li>
          <li style="display:list-item;border:0;padding:0">아래에 코드와 아이디 넣고 승인 → 그 사람 화면이 자동으로 바뀌어요</li>
        </ol>
      </div>
      <form class="card" id="approve">
        <div class="row">
          <div><label for="code">코드</label><input id="code" placeholder="OK-ABC123" autocapitalize="characters" autocomplete="off" /></div>
          <div><label for="user">인스타 아이디</label><input id="user" placeholder="@아이디" autocapitalize="off" autocomplete="off" /></div>
        </div>
        <button type="submit">승인</button>
        <div class="msg" id="msg"></div>
      </form>
      <div class="card">
        <div class="head"><b>승인 기다리는 코드</b><button class="ghost" id="reload" type="button">새로고침</button></div>
        <ul id="list"></ul>
      </div>
    </div>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    let token = '';
    try { token = localStorage.getItem('adminToken') || ''; } catch {}

    async function call(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { 'x-admin-token': token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = null;
      try { data = await res.json(); } catch {}
      return { status: res.status, data: data || {} };
    }

    const ago = (t) => {
      const m = Math.round((Date.now() - t) / 60000);
      return m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`;
    };

    async function load() {
      const r = await call('GET', '/api/admin/codes');
      if (r.status === 401) return logout('비밀번호가 맞지 않아요.');
      const list = $('#list');
      if (r.status !== 200) {
        list.innerHTML = '<li class="empty">불러오지 못했어요.</li>';
        return;
      }
      list.innerHTML = r.data.codes.length
        ? r.data.codes
            .map((c) => `<li><div><div class="code">${c.display}</div><div class="meta">${c.purpose === 'ranking' ? '랭킹' : '단계 열기'} · ${ago(c.createdAt)}</div></div><button class="ghost" data-code="${c.display}" type="button">선택</button></li>`)
            .join('')
        : '<li class="empty">지금은 없어요.</li>';
    }

    function logout(text) {
      token = '';
      try { localStorage.removeItem('adminToken'); } catch {}
      $('#app').hidden = true;
      $('#login').hidden = false;
      $('#login-msg').textContent = text || '';
      $('#login-msg').className = 'msg bad';
    }

    async function login() {
      token = $('#token').value.trim() || token;
      if (!token) return;
      const r = await call('GET', '/api/admin/codes');
      if (r.status !== 200) return logout(r.status === 401 ? '비밀번호가 맞지 않아요.' : '서버에 연결하지 못했어요.');
      try { localStorage.setItem('adminToken', token); } catch {}
      $('#login').hidden = true;
      $('#app').hidden = false;
      load();
    }

    const ERR = {
      bad_username: '아이디 형식이 이상해요 (영문·숫자·._ 만).',
      code_not_found: '없는 코드예요. 다시 확인해 주세요.',
      already_verified: '이미 승인된 코드예요.',
      expired: '만료된 코드예요. 새 코드를 받아 다시 보내 달라고 해 주세요.',
    };

    $('#approve').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('#msg');
      const code = $('#code').value.trim();
      const username = $('#user').value.trim();
      if (!code || !username) {
        msg.textContent = '코드와 아이디를 둘 다 넣어 주세요.';
        msg.className = 'msg bad';
        return;
      }
      const r = await call('POST', '/api/admin/approve', { code, username });
      if (r.status === 200) {
        msg.textContent = `승인했어요: @${r.data.username}`;
        msg.className = 'msg ok';
        $('#code').value = '';
        $('#user').value = '';
        load();
      } else if (r.status === 401) logout('비밀번호가 맞지 않아요.');
      else {
        msg.textContent = ERR[r.data.error] || '승인하지 못했어요.';
        msg.className = 'msg bad';
      }
    });
    $('#list').addEventListener('click', (e) => {
      const b = e.target.closest('[data-code]');
      if (!b) return;
      $('#code').value = b.dataset.code;
      $('#user').focus();
    });
    $('#reload').addEventListener('click', load);
    $('#login-btn').addEventListener('click', login);
    $('#token').addEventListener('keydown', (e) => e.key === 'Enter' && login());
    if (token) login();
  </script>
</body>
</html>
